<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="stylesheet" href="shared/tokens.css" />
    <link rel="stylesheet" href="options.css" />
    <title>aClicker — Settings</title>
  </head>
  <body>
    <div class="options">
      <!-- ── Header ──────────────────────────────────────────────────── -->
      <header class="opt-header">
        <div class="opt-header__brand">
          <div class="opt-header__icon" aria-hidden="true"></div>
          <div>
            <h1 class="opt-header__title">aClicker Settings</h1>
            <p class="opt-header__subtitle">Configure your automation preferences</p>
          </div>
        </div>
      </header>

      <!-- ── Settings groups (rendered by JS) ────────────────────────── -->
      <main id="settingsContainer" class="settings-container"></main>

      <!-- ── Footer ──────────────────────────────────────────────────── -->
      <footer class="opt-footer">
        <button id="resetBtn" class="opt-footer__reset" type="button">Reset to Defaults</button>
        <span class="opt-footer__version" id="versionLabel"></span>
      </footer>
    </div>

    <script src="shared/storage.js"></script>
    <script src="shared/settings-schema.js"></script>
    <script src="options.js"></script>
  </body>
</html>
